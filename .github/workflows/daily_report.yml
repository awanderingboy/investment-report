name: Daily Investment Report

on:
  schedule:
    - cron: '13 22 * * *'  # UTC 22:13 = KST 07:13
  workflow_dispatch:       # GitHub UI에서 수동 실행 가능
    inputs:
      force_send:
        description: 'Force send report, bypass duplicate guard'
        required: false
        type: boolean
        default: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run investment report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND_REPORT: ${{ github.event.inputs.force_send || 'false' }}
        run: python investment_report.py
