name: Daily Investment Report

on:
  schedule:
    - cron: '13 22 * * *'  # UTC 22:13 = KST 07:13
  workflow_dispatch:       # GitHub UI에서 수동 실행 가능
    inputs:
      force_send:
        description: 'Force send report, bypass duplicate guard'
        required: false
        type: boolean
        default: false

concurrency:
  group: investment-report-daily-${{ github.ref }}
  cancel-in-progress: false   # 먼저 실행 중인 것이 끝날 때까지 대기

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run candidate screener
        continue-on-error: true
        run: python candidate_screener.py --fast --timeout-seconds 300

      - name: Check candidate screener output
        continue-on-error: true
        run: |
          ls -lah outputs || true
          python - <<'EOF'
          import glob, json, os
          files = sorted(glob.glob("outputs/top_candidates_*.json"))
          print("candidate files:", files[-3:] if files else [])
          if files:
              path = files[-1]
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              print("latest:", path)
              print("top_candidates:", len(data.get("top_candidates", [])))
              print("market_scan_status:", data.get("market_scan_status"))
              print("quality_check:", data.get("meta", {}).get("quality_check", {}))
          else:
              print("No top_candidates json found — report will run without screener data")
          EOF

      - name: Run investment report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND_REPORT: ${{ github.event.inputs.force_send || 'false' }}
        run: python investment_report.py

      - name: Commit send record
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .sent_reports.json 2>/dev/null || true
          git diff --staged --quiet && echo "No send record changes" || \
            git commit -m "chore: update daily send record [skip ci]"
          git push origin HEAD 2>/dev/null || true
