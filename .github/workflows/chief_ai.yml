name: Chief AI — Daily Summary

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '테스트 모드'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  run-chief-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Check Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN: MISSING"
          else
            echo "TELEGRAM_BOT_TOKEN: EXISTS"
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID: MISSING"
          else
            echo "TELEGRAM_CHAT_ID: EXISTS"
          fi

      - name: Direct Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token   = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          print("TOKEN_EXISTS:", bool(token))
          print("CHAT_ID_EXISTS:", bool(chat_id))
          if not token or not chat_id:
              print("SKIP: missing telegram env")
              raise SystemExit(1)
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          res = requests.post(url, data={"chat_id": chat_id, "text": "✅ GitHub Actions 텔레그램 직접 테스트 성공"}, timeout=15)
          print("STATUS_CODE:", res.status_code)
          data = res.json()
          print("OK:", data.get("ok"))
          print("DESCRIPTION:", data.get("description"))
          PY

      - name: 총괄 AI 실행
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          CHIEF_TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python chief_ai.py

      - name: 실행 결과 확인
        if: always()
        run: |
          echo "=== agent_status.json ==="
          cat agent_status.json | python -m json.tool | head -30
          echo "=== chief_ai_log.json ==="
          cat logs/chief_ai_log.json | python -m json.tool | tail -20
